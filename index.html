<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Yar 🌻❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 50%, #17102d 0%, #090615 45%, #020107 100%);
            font-family: Georgia, 'Times New Roman', serif;
            color: white;
        }

        .galaxy {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Estrellas */
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px white;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.25;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* Nebulosa */
        .nebula {
            position: absolute;
            width: 650px;
            height: 650px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    rgba(184, 122, 255, 0.18),
                    rgba(111, 66, 193, 0.08) 35%,
                    transparent 70%
                );
            filter: blur(30px);
            animation: breathe 8s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            from {
                transform: translate(-50%, -50%) scale(0.9);
            }

            to {
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        /* Contenido */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 700px;
            text-align: center;
            z-index: 10;
        }

        .small-text {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d9c8ff;
            margin-bottom: 25px;
            opacity: 0;
            animation: appear 2s ease forwards;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: normal;
            margin-bottom: 20px;
            background: linear-gradient(
                120deg,
                #ffffff,
                #f7d9ff,
                #ffe4a8,
                #ffffff
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255, 210, 255, 0.5));
            animation: glow 4s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 15px rgba(255, 210, 255, 0.35));
            }

            to {
                filter: drop-shadow(0 0 35px rgba(255, 210, 255, 0.75));
            }
        }

        .message {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            line-height: 1.8;
            color: #f4eefa;
            opacity: 0;
            animation: appear 2s ease forwards;
            animation-delay: 1.5s;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .enter-button {
            margin-top: 35px;
            padding: 14px 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.4s;
            opacity: 0;
            animation: appear 2s ease forwards;
            animation-delay: 3s;
        }

        .enter-button:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 30px rgba(255, 220, 255, 0.5);
        }

        /* Corazones */
        .heart {
            position: absolute;
            color: #ffb7df;
            font-size: 18px;
            pointer-events: none;
            animation: floatHeart 5s linear forwards;
            z-index: 20;
        }

        @keyframes floatHeart {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.5);
            }

            20% {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateY(-180px) scale(1.3);
            }
        }

        /* Adaptación móvil */
        @media (max-width: 600px) {
            .nebula {
                width: 450px;
                height: 450px;
            }

            .small-text {
                font-size: 0.75rem;
                letter-spacing: 3px;
            }

            .message {
                line-height: 1.6;
            }

            .enter-button {
                padding: 13px 27px;
            }
        }
    </style>
</head>

<body>

<div class="galaxy">

    <div class="nebula"></div>

    <div class="content">

        <div class="small-text">
            Para mi Yar ✨
        </div>

        <h1>25</h1>

        <div class="message">
            Hoy cumple años la niña<br>
            que hace bonito mi universo. 🌻❤️
        </div>

        <button class="enter-button" onclick="enterUniverse()">
            ✨ Entrar a mi universo ✨
        </button>

    </div>

</div>

<script>

    /* Crear estrellas */
    const galaxy = document.querySelector('.galaxy');

    for (let i = 0; i < 180; i++) {

        const star = document.createElement('div');

        star.classList.add('star');

        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';

        const size = Math.random() * 3 + 1;

        star.style.width = size + 'px';
        star.style.height = size + 'px';

        star.style.animationDelay =
            Math.random() * 3 + 's';

        galaxy.appendChild(star);
    }

    /* Crear corazones al entrar */
    function enterUniverse() {

        for (let i = 0; i < 35; i++) {

            const heart = document.createElement('div');

            heart.classList.add('heart');

            heart.innerHTML =
                Math.random() > 0.5 ? '❤️' : '💗';

            heart.style.left =
                Math.random() * 100 + '%';

            heart.style.top =
                (50 + Math.random() * 30) + '%';

            heart.style.animationDelay =
                Math.random() * 1.5 + 's';

            galaxy.appendChild(heart);

        }

        setTimeout(() => {

            alert(
                "Esta es solo la primera parte, mi Yar... 🌻❤️"
            );

        }, 900);
    }

</script>

</body>
</html>
